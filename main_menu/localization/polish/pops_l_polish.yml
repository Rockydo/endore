l_polish:
 nobles: "Lords & Elders"
 nobles_desc: "Hereditary houses, clan elders, and office-holding households entrusted with land, counsel, and authority."
 clergy: "Loremasters & Keepers"
 clergy_desc: "Lorekeepers, healers, memory-wardens, ritual specialists, and other custodians of a people's spiritual and learned traditions."
 burghers: "Townsfolk & Traders"
 burghers_desc: "Merchants, householders, innkeepers, and independent craftsfolk sustaining towns, havens, and long roads."
 laborers: "Craftsfolk & Laborers"
 laborers_desc: "Smiths, masons, miners, carriers, and other working households supporting workshops, delvings, and great works."
 soldiers: "Warriors & Garrisons"
 soldiers_desc: "Retainers, riders, guards, scouts, and the households that sustain standing watches and hosts."
 peasants: "Freeholders & Husbandmen"
 peasants_desc: "Farmers, herders, gardeners, and village households who keep the settled lands."
 tribesmen: "Wild Folk"
 tribesmen_desc: "Kin-based and self-governing communities of hunters, herders, forest folk, and people beyond close state control."
 slaves: "Thralls"
 slaves_desc: "People held in bondage by the Shadow, corsair powers, or warlike masters and compelled to labour or serve."
